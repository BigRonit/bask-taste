name: Build taste corpus

on:
  schedule:
    # Mondays 09:00 UTC — Sunday evening in Cambridge, after the weekly save pass
    - cron: "0 9 * * 1"
  workflow_dispatch:        # lets you trigger it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build corpus
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
        run: python scripts/build_corpus.py

      - name: Commit changes
        run: |
          git config user.name "taste-bot"
          git config user.email "actions@github.com"
          git add TASTE-CORPUS.md data/corpus.json
          git diff --staged --quiet || git commit -m "corpus: $(date -u +%Y-%m-%d)"
          git push
